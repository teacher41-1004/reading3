<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASTEROID ATTACK</title>
<style>
:root{--d:#000;--m:#1d4e72;--l:#7fb0d3;--y:#d9a400;--yl:#fff3b8;--fs:16px;--lh:1.5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;cursor:default!important;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(1px 1px at 12% 20%,#dbeaf5,transparent),radial-gradient(1px 1px at 70% 12%,#dbeaf5,transparent),radial-gradient(1.5px 1.5px at 35% 82%,#dbeaf5,transparent),radial-gradient(1px 1px at 90% 65%,#dbeaf5,transparent),radial-gradient(1px 1px at 55% 45%,#dbeaf5,transparent),radial-gradient(1px 1px at 5% 70%,#dbeaf5,transparent),linear-gradient(#4d8fbf,#4d8fbf);background-color:#4d8fbf;color:var(--d);font-family:Georgia,'Times New Roman',serif}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding:10px}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-weight:bold}
#hl{justify-self:start}#hr{justify-self:end;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#ht{text-align:center;font-size:1.5em;letter-spacing:.06em;border-bottom:3px solid var(--y);padding-bottom:2px}
.bar{height:10px;background:var(--l);border-radius:6px;overflow:hidden}#fill{height:100%;width:0;background:var(--y);transition:width .3s}
main{flex:1;min-height:0;display:flex;gap:12px}
.card{border:2px solid #6fa5cc;border-radius:16px;box-shadow:0 3px 14px rgba(0,0,0,.25);padding:14px;overflow-y:auto;background:#a9cde6;font-size:var(--fs)}
#read{flex:3;min-width:0}#side{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.ln{display:block;white-space:nowrap;position:relative;padding-left:2.4em;line-height:var(--lh)}
.ln[data-n]::before{content:attr(data-n);position:absolute;left:0;color:var(--m);font-size:.85em}
.hl{background:#fff2a8;color:#000;border-radius:3px}
.card{scrollbar-width:none;-ms-overflow-style:none}.card::-webkit-scrollbar{display:none}
.ins{font-weight:bold;letter-spacing:.06em;color:var(--d)}
.opt,.btn{font:inherit;font-size:var(--fs);color:var(--d);background:#e6f1f9;border:2px solid var(--m);border-radius:12px;padding:12px;text-align:left}
.opt{display:flex;align-items:center;gap:10px;width:100%;flex:1 0 auto}
.badge{background:var(--l);border:2px solid var(--m);border-radius:50%;min-width:2em;height:2em;display:inline-flex;align-items:center;justify-content:center;font-weight:bold}
.opt.sel{background:var(--yl);border-color:var(--y)}
.opt.ok{background:#a8e6b8;border-color:#2e8b3e}.opt.bad{background:#f4b3b3;border-color:#c0392b}
.btn{background:#e6f1f9;color:#000;font-weight:bold;text-align:center;padding:10px 14px}
.btn.alt{background:#b5d3e8;color:var(--d)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}
.lab{color:var(--m);font-weight:bold}
.wide{max-width:900px;margin:0 auto;width:100%}
ul{margin:.4em 0;padding-left:1.4em}li{margin:.3em 0}
h2{margin:.2em 0 .5em}
@media(max-width:700px){main{flex-direction:column}#read{flex:1 1 50%}#side{flex:1 1 50%}header{font-size:.8em}}
</style></head><body>
<div id="app">
<header><div id="hl"></div><div id="ht"><svg width="30" height="30" viewBox="0 0 100 100" style="vertical-align:middle"><path d="M20 35L40 12L68 16L88 38L84 68L60 90L30 84L10 60Z" fill="#8a8e9e"/><circle cx="38" cy="38" r="9" fill="#5f6373"/><circle cx="64" cy="58" r="12" fill="#5f6373"/><circle cx="35" cy="68" r="6" fill="#5f6373"/></svg> <span>ASTEROID</span> ATTACK <svg width="30" height="30" viewBox="0 0 100 100" style="vertical-align:middle"><path d="M20 35L40 12L68 16L88 38L84 68L60 90L30 84L10 60Z" fill="#8a8e9e"/><circle cx="38" cy="38" r="9" fill="#5f6373"/><circle cx="64" cy="58" r="12" fill="#5f6373"/><circle cx="35" cy="68" r="6" fill="#5f6373"/></svg></div>
<div id="hr"><span id="clock">00:00</span><button class="btn" id="bs" style="padding:4px 10px">Start</button><button class="btn alt" id="bp" style="padding:4px 10px">Pause</button><span id="sc"></span></div></header>
<div class="bar"><div id="fill"></div></div>
<main><div id="read" class="card"></div><div id="side" class="card"></div></main>
</div>
<script>
const P=[
[["IT COULD EASILY BE THE plot FOR A HOLLYWOOD DISASTER MOVIE: In February 2012, a young dentist called Jaime Nomen was sailing the Mediterranean coast of Spain, checking images on his laptop from a telescope 600 kilometres away.","q1"],["Suddenly, he spotted a dot of light racing through space.",""],["Nomen knew exactly what it was.",""],["He warned the International Astronomical Union, which collects information about asteroids, and telescopes around the world immediately started following the new asteroid’s orbit.",""],["They made a spectacular discovery: on 15th February 2013, ‘Asteroid 2012 DA14’ would pass the Earth just 27,700 kilometres above our heads.","q2"],["In space terms, that is close – very close.","q2"],["Asteroid 2012 DA14 was 30 metres across, which is enormous, but not quite as large as the asteroid that exploded in 1908 over the remote Tunguska region of Siberia, Russia.",""],["The Tunguska event destroyed 80 million trees across 2,000 square kilometres and even people over 60 kilometres away were knocked over.","q3"]],
[["STRANGELY ENOUGH, on the same day in February 2013 that Asteroid 2012 DA14 passed the Earth, a slightly smaller asteroid suddenly appeared over the Chelyabinsk region of Russia.",""],["It was travelling at 70,000 km/h and was apparently almost as bright as the Sun.","q4"],["It was around 17 metres across, easily the largest object to enter the Earth’s atmosphere since 1908.","q5"],["It exploded before it hit the Earth, and a massive shock wave cracked glass and ruined buildings hundreds of kilometres away.",""]],
[["IN TERMS OF POTENTIAL DAMAGE, a Tunguska-sized asteroid (50–100 metres across) would be a good deal worse.","q5 q6"],["It could easily destroy a city, and at sea it would trigger a terrible tsunami.","q6"],["Some asteroids are far bigger than that – up to 10 kilometres across – and would generate such a powerful explosion that clouds of dust would cover the Earth for years.",""],["This means life on Earth could even be in danger.",""],["A huge asteroid like this crashed in the Yucatán Peninsula in Mexico 65 million years ago and contributed to the death of a lot of plant and animal life on Earth – including the extinction of the dinosaurs.",""]],
[["SO HOW CAN WE PREDICT FUTURE ASTEROID CRASHES and, more importantly, can we prevent them?",""],["Asteroid scientists believe they have identified 90% of the giant space rocks with the potential to hit the Earth, but the smaller the asteroids are, the harder it is to spot them.","q7"],["However, smaller asteroids are likely to cause less destruction if they hit the Earth.",""]],
[["TO PREVENT A MAJOR DISASTER LIKE YUCATÁN, it would be far too risky to blow up an asteroid with a bomb.","q8"],["This would break it into millions of pieces, but thousands of smaller rocks would still hit the Earth.","q8"],["In the long term, the best way to avoid a serious incident is to use a spacecraft to push an asteroid in a different direction, over a period of five to ten years.","q9"],["But the pushing technique is so slow that an asteroid might hit the Earth before its orbit has moved far enough away.",""],["Scientists need more time to find faster ways of protecting Earth from asteroids, which is why, in the short term, it is so vital that we keep an eye on every single asteroid heading for the Earth.",""]],
[["IF THIS ALL SOUNDS RATHER TERRIFYING, RELAX.",""],["There are no confirmed reports of human death being caused by rocks from space.",""],["The vast majority of the Earth’s surface is unpopulated, so the chances of something landing on your head are pretty small.","q10"]]];
const Q=[
["Jaime Nomen spotted the asteroid by looking through a telescope himself.",1],
["Asteroid 2012 DA14 passed very close to the Earth.",0],
["The Tunguska event destroyed trees across an area of 2,000 square kilometres.",0],
["The Chelyabinsk asteroid travelled faster than the speed of sound.",2],
["The Chelyabinsk asteroid was larger than a Tunguska-sized asteroid.",1],
["An asteroid measuring 50–100 metres across could destroy a city.",0],
["Scientists have identified all the giant asteroids that could hit the Earth.",1],
["Blowing up a large asteroid with a bomb would solve the problem.",1],
["Using a spacecraft to change an asteroid’s direction could take five to ten years.",0],
["Most asteroids land in unpopulated areas of the Earth.",2]];
const INF=[4,5,10],OPTS=["TRUE","FALSE","NOT GIVEN"],N=Q.length,MAXC=106;
let view=0,score=0,secs=0,timer=null,st;
const $=id=>document.getElementById(id);
function reset(){st=Q.map(()=>({sel:null,chk:false,show:false}));score=0;secs=0;view=0;stop()}
function fmt(){return String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')}
function start(){if(!timer&&view>=1&&view<=N)timer=setInterval(()=>{secs++;$('clock').textContent=fmt()},1000)}
function stop(){clearInterval(timer);timer=null}
/* reading text with fixed line breaks */
let nLines=0;
function build(){let h='',n=0;
 P.forEach((p,pi)=>{const w=[];p.forEach(([t,k])=>t.split(' ').forEach(x=>w.push([x,k])));
  let line=[],len=0;let first=true;const flush=()=>{n++;const dn=first?` data-n="${pi+1}"`:'';first=false;h+=`<span class="ln"${dn}>`+line.map(([x,k],i)=>`<span data-e="${k}">${x}${i<line.length-1?' ':''}</span>`).join('')+'</span>';line=[];len=0};
  w.forEach(o=>{const add=(len?1:0)+o[0].length;if(len+add>MAXC){flush()}len+=(len?1:0)+o[0].length;line.push(o)});
  flush()});
 nLines=n;$('read').innerHTML=h}
function fit(){const r=$('read');if(r.style.display==='none')return;
 const root=document.documentElement;root.style.setProperty('--fs','100px');root.style.setProperty('--lh','1.5');
 let mx=0;r.querySelectorAll('.ln').forEach(l=>mx=Math.max(mx,l.scrollWidth));
 const cs=getComputedStyle(r),aw=r.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
 let fs=Math.max(9,Math.min(30,100*aw/mx));root.style.setProperty('--fs',fs+'px');
 const ah=r.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
 root.style.setProperty('--lh',Math.max(1.3,Math.min(1.7,ah/(nLines*fs))))}
function render(){
 const q=view>=1&&view<=N,s=q?st[view-1]:null;
 $('hl').textContent=q?`Slide ${view} of ${N}`:'';
 $('sc').textContent=`Score: ${score}/${N}`;
 $('fill').style.width=(q?view/N*100:view>N?100:0)+'%';
 $('clock').textContent=fmt();
 $('read').style.display=q?'':'none';
 const side=$('side');side.className='card'+(q?'':' wide');
 if(view===0){side.innerHTML=`<svg width="110" height="110" viewBox="0 0 100 100"><path d="M20 35L40 12L68 16L88 38L84 68L60 90L30 84L10 60Z" fill="#8a8e9e"/><circle cx="38" cy="38" r="9" fill="#5f6373"/><circle cx="64" cy="58" r="12" fill="#5f6373"/><circle cx="35" cy="68" r="6" fill="#5f6373"/></svg><h2>Instructions</h2><p>In boxes 1–10 on your answer sheet, write:</p><ul><li><b>TRUE</b> – if the statement agrees with the information.</li><li><b>FALSE</b> – if the statement contradicts the information.</li><li><b>NOT GIVEN</b> – if there is no information on this.</li></ul><button class="btn" id="go">Start →</button>`;$('go').onclick=()=>{view=1;start();render()}}
 else if(view>N){side.innerHTML=`<h2>🏆 Final score</h2><p>You scored <b>${score}/${N}</b>.</p><p>Total time: <b>${fmt()}</b></p><button class="btn" id="pa">Play Again</button>`;$('pa').onclick=()=>{reset();render()}}
 else{
  side.innerHTML=`<div class="ins">Read the text again. Choose the correct answer.</div><div>${view}. ${Q[view-1][0]}</div>`+
  OPTS.map((o,i)=>{let c='opt';if(s.chk){if(i===Q[view-1][1])c+=' ok';else if(i===s.sel)c+=' bad'}else if(i===s.sel)c+=' sel';return `<button class="${c}" data-i="${i}"><span class="badge">${'ABC'[i]}</span>${o}</button>`}).join('')+
  (s.show&&INF.includes(view)?`<div class="lab">Inferred answer (evaluation/inference)</div>`:'')+
  `<div class="row"><button class="btn" id="ck" ${s.sel===null||s.chk?'disabled':''}>Check Answers</button><button class="btn alt" id="sa" ${s.chk?'':'disabled'}>Show Answer</button></div>`+
  `<div class="row"><button class="btn alt" id="pv" ${view===1?'disabled':''}>← Previous</button><button class="btn" id="nx">${view===N?'Finish':'Next →'}</button></div>`;
  side.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(!s.chk){s.sel=+b.dataset.i;render()}});
  $('ck').onclick=()=>{s.chk=true;if(s.sel===Q[view-1][1])score++;render()};
  $('sa').onclick=()=>{s.show=true;render()};
  $('pv').onclick=()=>{view--;render()};
  $('nx').onclick=()=>{if(view===N){stop()}view++;render()};
  fit()}
 document.querySelectorAll('#read [data-e]').forEach(e=>e.classList.toggle('hl',!!(s&&s.show&&e.dataset.e.split(' ').includes('q'+view))));
}
$('bs').onclick=start;$('bp').onclick=stop;
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
window.addEventListener('resize',fit);
build();reset();render();
</script></body></html>
